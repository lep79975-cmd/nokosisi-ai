<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nokosisi.ai - Trợ Lý Ảo Siêu Cấp</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050d;
            color: #fff;
        }

        /* Background Effects */
        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(5, 5, 13, 0.8) 0%, #05050d 100%);
            z-index: 1;
        }

        /* Main Container Fullscreen */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        /* HEADER */
        header {
            height: 70px;
            padding: 0 25px;
            background: rgba(15, 15, 30, 0.6);
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .ai-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ai-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2ff, #8a2be2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(0, 242, 255, 0.4); }
            100% { box-shadow: 0 0 25px rgba(138, 43, 226, 0.8); }
        }

        .ai-info h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #00f2ff, #b572ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .ai-status {
            font-size: 12px;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        /* CHAT BOX */
        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 255, 0.2);
            border-radius: 10px;
        }

        .msg {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bot Message */
        .msg.bot {
            align-self: flex-start;
            background: rgba(20, 20, 45, 0.75);
            border: 1px solid rgba(0, 242, 255, 0.25);
            border-top-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            color: #e0e6ff;
        }

        /* User Message */
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0088ff, #7000ff);
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3);
            color: #fff;
        }

        .msg-sender {
            font-size: 11px;
            margin-bottom: 4px;
            opacity: 0.7;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* INPUT AREA */
        .input-area {
            padding: 20px 25px;
            background: rgba(10, 10, 25, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #00f2ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .send-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00f2ff, #7000ff);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        .send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.7);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Typing effect indicator */
        .typing {
            display: flex;
            gap: 5px;
            padding: 8px 12px;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: #00f2ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="app-container">
        <!-- HEADER -->
        <header>
            <div class="ai-brand">
                <div class="ai-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="ai-info">
                    <h1>nokosisi.ai</h1>
                    <div class="ai-status">
                        <div class="status-dot"></div>
                        <span id="data-status">Đang nạp dữ liệu tri thức...</span>
                    </div>
                </div>
            </div>
            <div style="font-size: 12px; color: rgba(255,255,255,0.5);">
                <i class="fa-solid fa-bolt" style="color: #00f2ff;"></i> Online
            </div>
        </header>

        <!-- CHAT HISTORY -->
        <div class="chat-box" id="chatBox">
            <div class="msg bot">
                <div class="msg-sender">nokosisi.ai</div>
                Xin chào! Tôi là **nokosisi.ai**. Hãy đặt câu hỏi, tôi sẽ tra cứu dữ liệu và trả lời bạn ngay!
            </div>
        </div>

        <!-- INPUT BOX -->
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn tại đây..." onkeypress="handleKeyPress(event)">
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const DATA_URL = "https://lep79975-cmd.github.io/chatbot_dulieu/dulieuai.txt";
        let qaDatabase = [];

        // 1. TẢI VÀ PHÂN TÍCH DỮ LIỆU TỪ LINK GITHUB
        async function loadAIData() {
            const statusElem = document.getElementById('data-status');
            try {
                // Thêm timestamp để tránh bị dính cache
                const response = await fetch(DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error("Không thể tải file dữ liệu");
                
                const textData = await response.text();
                parseData(textData);

                statusElem.innerText = `Đã kết nối (${qaDatabase.length} câu trả lời)`;
                statusElem.style.color = "#00ff88";
            } catch (error) {
                console.error("Lỗi:", error);
                statusElem.innerText = "Lỗi nạp dữ liệu (Kiểm tra CORS/Link)";
                statusElem.style.color = "#ff4757";
            }
        }

        // 2. CHUYỂN DỔI DẠNG CHỮ [ CÂU HỎI ] : [ TRẢ LỜI ] THÀNH MẢNG
        function parseData(text) {
            qaDatabase = [];
            const lines = text.split('\n');

            lines.forEach(line => {
                let cleanLine = line.trim();
                if (!cleanLine) return;

                // Tách câu hỏi và trả lời qua dấu `:`
                let parts = cleanLine.split(':');
                if (parts.length >= 2) {
                    // Xóa bỏ các ký tự `[` và `]` cùng khoảng trắng thừa
                    let q = parts[0].replace(/[\[\]]/g, '').trim().toLowerCase();
                    let a = parts.slice(1).join(':').replace(/[\[\]]/g, '').trim();

                    if (q && a) {
                        qaDatabase.push({ question: q, answer: a });
                    }
                }
            });
        }

        // 3. TÌM CÂU TRẢ LỜI PHÙ HỢP
        function getBotResponse(userText) {
            let cleanInput = userText.trim().toLowerCase();

            if (qaDatabase.length === 0) {
                return "Dữ liệu tri thức chưa được tải xong, vui lòng đợi giây lát...";
            }

            // Tìm khớp chính xác hoặc chứa từ khóa
            let matched = qaDatabase.find(item => cleanInput === item.question || cleanInput.includes(item.question) || item.question.includes(cleanInput));

            if (matched) {
                return matched.answer;
            }

            return "Xin lỗi, câu hỏi này nằm ngoài bộ dữ liệu hiện tại của nokosisi.ai!";
        }

        // 4. HIỂN THỊ TIN NHẮN LÊN MÀN HÌNH
        function appendMessage(sender, text, type) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            
            msgDiv.innerHTML = `
                <div class="msg-sender">${sender}</div>
                <div>${text}</div>
            `;

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 5. GỬI TIN NHẮN
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();

            if (!text) return;

            // Hiện tin nhắn người chơi
            appendMessage("Bạn", text, "user");
            input.value = "";

            // Hiệu ứng Bot đang suy nghĩ
            const chatBox = document.getElementById('chatBox');
            const typingDiv = document.createElement('div');
            typingDiv.className = "msg bot";
            typingDiv.id = "typingIndicator";
            typingDiv.innerHTML = `
                <div class="msg-sender">nokosisi.ai</div>
                <div class="typing"><span></span><span></span><span></span></div>
            `;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Giả lập thời gian suy nghĩ 0.6s cho mượt
            setTimeout(() => {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();

                // Trả lời
                let reply = getBotResponse(text);
                appendMessage("nokosisi.ai", reply, "bot");
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Tự động tải dữ liệu khi mở trang
        window.onload = loadAIData;
    </script>
</body>
</html>
